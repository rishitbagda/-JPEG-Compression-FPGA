name: Apply organized project
on:
  push:
    branches: [main]
    paths: [project-replacement.zip]
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved source tree
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil, zipfile
          root = pathlib.Path.cwd()
          bundle = root / 'project-replacement.zip'
          expected = '0c1d84f1d1804eba05c9b84183ae347111465b91fecb848981d800642973e951'
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == expected
          stage = root.parent / 'approved-project-stage'
          stage.mkdir(exist_ok=True)
          with zipfile.ZipFile(bundle) as archive:
              for name in archive.namelist():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] == 'JPEG-Compression-FPGA'
              archive.extractall(stage)
          source = stage / 'JPEG-Compression-FPGA'
          assert (source / 'README.md').is_file()
          assert len(list((source / 'rtl').glob('*.sv'))) == 25
          for entry in root.iterdir():
              if entry.name == '.git':
                  continue
              if entry.is_dir():
                  shutil.rmtree(entry)
              else:
                  entry.unlink()
          for entry in source.iterdir():
              destination = root / entry.name
              if entry.is_dir():
                  shutil.copytree(entry, destination)
              else:
                  shutil.copy2(entry, destination)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace incomplete pipeline with organized final JPEG project'
          git push origin HEAD:main
